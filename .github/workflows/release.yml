name: Bouw WordPress-pluginrelease

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Pluginpakket bouwen
        shell: bash
        run: |
          mkdir -p build
          cp -R wordpress/wp-content/plugins/hgc-keuzehulp build/hgc-keuzehulp
          cd build
          zip -r ../hgc-keuzehulp.zip hgc-keuzehulp

      - name: GitHub Release publiceren
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" hgc-keuzehulp.zip \
            --title "HGC - Interne WebsiteTechniek ${GITHUB_REF_NAME}" \
            --generate-notes
