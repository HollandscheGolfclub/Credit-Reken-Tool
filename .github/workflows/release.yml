name: Bouw WordPress-pluginrelease

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Pluginpakket bouwen
        shell: bash
        run: |
          mkdir -p build
          cp -R wordpress/wp-content/plugins/hgc-credit-calculator build/hgc-credit-calculator
          cd build
          zip -r ../hgc-credit-calculator.zip hgc-credit-calculator

      - name: GitHub Release publiceren
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" hgc-credit-calculator.zip \
            --title "HGC Credit Calculator ${GITHUB_REF_NAME}" \
            --generate-notes
